<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-semibold" href="#">
                <i class="fa-solid fa-warehouse me-2"></i>Warehouse Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#warehouses-section">
                            <i class="fa-solid fa-building me-1"></i>Lager
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#items-section">
                            <i class="fa-solid fa-boxes-stacked me-1"></i>Bestand
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4">

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="h3 mb-1">Übersicht</h1>
                <p class="text-muted mb-0">Lagerorte und Bestände im Überblick</p>
            </div>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookItemModal">
                <i class="fa-solid fa-plus me-2"></i>Neues Item einbuchen
            </button>
        </div>

        <section id="warehouses-section" class="mb-5">
            <div class="section-card">
                <div class="section-header">
                    <h2 class="h5 mb-0">
                        <i class="fa-solid fa-building text-primary me-2"></i>Lager-Übersicht
                    </h2>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Name</th>
                                <th scope="col">Standort</th>
                                <th scope="col">Kapazität</th>
                            </tr>
                        </thead>
                        <tbody id="warehouses-table-body">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">
                                    <i class="fa-solid fa-spinner fa-spin me-2"></i>Lade Lager …
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="items-section">
            <div class="section-card">
                <div class="section-header">
                    <h2 class="h5 mb-0">
                        <i class="fa-solid fa-boxes-stacked text-primary me-2"></i>Bestand
                    </h2>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Name</th>
                                <th scope="col">Menge</th>
                                <th scope="col">Typ</th>
                            </tr>
                        </thead>
                        <tbody id="items-table-body">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">
                                    <i class="fa-solid fa-spinner fa-spin me-2"></i>Lade Bestand …
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <div class="modal fade" id="bookItemModal" tabindex="-1" aria-labelledby="bookItemModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookItemModalLabel">
                        <i class="fa-solid fa-arrow-down me-2 text-primary"></i>Neues Item einbuchen
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <form id="book-item-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="item-name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="item-name" placeholder="z. B. Akkubohrer 18V" required>
                        </div>
                        <div class="mb-3">
                            <label for="item-quantity" class="form-label">Menge</label>
                            <input type="number" class="form-control" id="item-quantity" min="1" placeholder="10" required>
                        </div>
                        <div class="mb-3">
                            <label for="item-type" class="form-label">Typ</label>
                            <select class="form-select" id="item-type" required>
                                <option value="" selected disabled>Bitte wählen …</option>
                                <option value="Tool">Werkzeug</option>
                                <option value="ConsumableMaterial">Verbrauchsmaterial</option>
                            </select>
                        </div>
                        <div class="mb-0">
                            <label for="item-warehouse" class="form-label">Lager</label>
                            <select class="form-select" id="item-warehouse" required>
                                <option value="" selected disabled>Bitte wählen …</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Abbrechen</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-check me-1"></i>Einbuchen
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
