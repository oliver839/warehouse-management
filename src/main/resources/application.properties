spring.application.name=warehouse-management

# Demo provider is active by default. Switch to http for a real adapter.
shipping.provider=${SHIPPING_PROVIDER:demo}
shipping.api-url=${SHIPPING_API_URL:https://api.example.invalid}
shipping.api-key=${SHIPPING_API_KEY:}
shipping.api-secret=${SHIPPING_API_SECRET:}
shipping.tenant=${SHIPPING_TENANT:demo-tenant}

app.security.admin-username=${WMS_ADMIN_USERNAME:admin}
app.security.admin-password=${WMS_ADMIN_PASSWORD:change-me-admin}
app.security.worker-username=${WMS_WORKER_USERNAME:worker}
app.security.worker-password=${WMS_WORKER_PASSWORD:change-me-worker}
app.security.manager-username=${WMS_MANAGER_USERNAME:manager}
app.security.manager-password=${WMS_MANAGER_PASSWORD:change-me-manager}
